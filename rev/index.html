<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UQlearn - Course Reviewer Portal</title>
    <link rel="icon" type="image/png" href="https://uqlearn.org/logo/logo.png" />
    <link rel="shortcut icon" href="https://uqlearn.org/logo/logo.png" />
    <link rel="apple-touch-icon" href="https://uqlearn.org/logo/logo.png" />
    <meta name="description" content="Course Reviewer & Quality Assessment Portal on UQlearn." />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .loader-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #f8fafc;
        z-index: 10;
        transition: opacity 0.3s ease;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #14b8a6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      .fallback {
        margin-top: 12px;
        font-size: 14px;
        color: #94a3b8;
        text-align: center;
      }
      .fallback a {
        color: #2dd4bf;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="loader" class="loader-container">
      <div class="spinner"></div>
      <div style="font-weight: 600; font-size: 18px;">Loading UQlearn Reviewer Portal...</div>
      <div class="fallback">
        If content does not load, <a href="https://uqlearn.org/reviewer" target="_blank">open reviewer portal directly</a>.
      </div>
    </div>
    <iframe 
      src="https://uqlearn.org/reviewer" 
      title="UQlearn Course Reviewer Portal"
      onload="document.getElementById('loader').style.opacity = '0'; setTimeout(() => document.getElementById('loader').style.display = 'none', 300);"
    ></iframe>
  </body>
</html>
